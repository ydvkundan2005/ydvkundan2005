<title id="title">Kundan's animated technology orbit</title>
<desc id="desc">A continuously rotating burgundy and plum technology orbit showing Kundan's programming languages, computer science foundations, web development, backend, databases, AI and machine learning, AWS fundamentals and developer tools.</desc>
<defs>
 <linearGradient id="wineGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51303C"/><stop offset=".55" stop-color="#825363"/><stop offset="1" stop-color="#A96F83"/></linearGradient>
 <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#51303C" stop-opacity=".12"/><stop offset=".5" stop-color="#A96F83" stop-opacity=".25"/><stop offset="1" stop-color="#51303C" stop-opacity=".12"/></linearGradient>
 <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
 <style><![CDATA[
  text{font-family:Inter,Segoe UI,Arial,sans-serif} .mono{font-family:ui-monospace,Consolas,monospace}
  .track{fill:none;stroke:#A88995;stroke-opacity:.40;stroke-width:1.3;stroke-dasharray:3 8}
  .chip{fill:#FFFFFF;stroke-width:1.2}
  .chip-label{fill:#35242C;font-size:11.5px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  .ring-a{stroke:#51303C}.ring-b{stroke:#825363}.ring-c{stroke:#A96F83}
  .muted{fill:#725D66}.title{fill:#35242C}
  @keyframes corePulse{0%,100%{filter:drop-shadow(0 0 3px #825363)}50%{filter:drop-shadow(0 0 11px #A96F83)}}
  .core{animation:corePulse 3.6s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
