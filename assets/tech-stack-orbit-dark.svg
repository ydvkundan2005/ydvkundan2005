<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-labelledby="title desc">
<title id="title">Kundan's animated technology orbit</title>
<desc id="desc">A continuously rotating burgundy and plum technology orbit showing Kundan's programming languages, computer science foundations, web development, backend, databases, AI and machine learning, AWS fundamentals and developer tools.</desc>
<defs>
 <linearGradient id="wineGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D0A9B6"/><stop offset=".55" stop-color="#B78396"/><stop offset="1" stop-color="#956879"/></linearGradient>
 <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D0A9B6" stop-opacity=".12"/><stop offset=".5" stop-color="#956879" stop-opacity=".25"/><stop offset="1" stop-color="#D0A9B6" stop-opacity=".12"/></linearGradient>
 <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
 <style><![CDATA[
  text{font-family:Inter,Segoe UI,Arial,sans-serif} .mono{font-family:ui-monospace,Consolas,monospace}
  .track{fill:none;stroke:#80616D;stroke-opacity:.42;stroke-width:1.3;stroke-dasharray:3 8}
  .chip{fill:#21171D;stroke-width:1.2}
  .chip-label{fill:#F5EEF1;font-size:11.5px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  .ring-a{stroke:#D0A9B6}.ring-b{stroke:#B78396}.ring-c{stroke:#956879}
  .muted{fill:#CBB9C0}.title{fill:#F5EEF1}
  @keyframes corePulse{0%,100%{filter:drop-shadow(0 0 3px #B78396)}50%{filter:drop-shadow(0 0 11px #956879)}}
  .core{animation:corePulse 3.6s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
<rect width="1280" height="650" rx="26" fill="#0D1116"/>
